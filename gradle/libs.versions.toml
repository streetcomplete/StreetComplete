[versions]

# Build plugins
kotlin = "2.4.20"
agp = "9.2.1"
compose = "1.12.1"
buildkonfig = "0.23.0"
# Keep compatible with Kotlin: https://mokkery.dev/docs/Setup/#compatibility
mokkery = "3.5.0"

# Kotlin
kotlinxCoroutines = "1.11.0"
atomicfu = "0.33.0"
kotlinxIo = "0.9.1"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"

# Data and services
koin = "4.2.2"
kermit = "2.2.0"
multiplatformSettings = "1.3.0"
sqlite = "2.7.1"
ktor = "3.5.2"
sha2 = "0.8.0"
xmlutil = "1.0.2"
kaml = "0.104.0"
countryboundaries = "3.0.0"
osmfeatures = "8.0.0"
osmOpeningHours = "0.4.0"

# UI
maplibre = "0.20.0"
navigationevent = "1.1.0"
navigation3 = "1.1.2"
lifecycle = "2.11.0"
composeGrid = "2.8.0"
reorderable = "3.1.0"
qrose = "1.3.0"
bignum = "0.3.10"
filekit = "0.16.0"
composeWebview = "2.0.3"

# Android
activity = "1.13.0"
work = "2.12.0"
desugarJdkLibs = "2.1.5"

# Build logic (independent plugin and library versions)
buildsrcKotlin = "2.0.0"
buildsrcKotlinxIo = "0.7.0"
buildsrcKotlinxSerialization = "1.8.1"
buildsrcKaml = "0.77.1"
klaxon = "5.6"
yamlbeans = "1.17"
jsoup = "1.18.3"
markdown = "0.7.3"

[plugins]

# Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

# Android
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Compose
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }

# Code generation and testing
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
mokkery = { id = "dev.mokkery", version.ref = "mokkery" }

# Build logic
buildsrc-kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "buildsrcKotlin" }

[libraries]

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }

# Atomics, locks, synchronization
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

# Dependency injection (library versions are supplied by the Koin BOM)
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidxCompose = { module = "io.insert-koin:koin-androidx-compose" }
koin-androidxWorkmanager = { module = "io.insert-koin:koin-androidx-workmanager" }

# Logging
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Settings
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }

# I/O
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }

# Location
maplibre-location = { module = "org.maplibre.compose:location", version.ref = "maplibre" }

# SQLite
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqliteBundledJvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }

# HTTP client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# SHA256 hashing for OAuth authentication
kotlincrypto-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "sha2" }

# XML
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
xmlutil-coreIo = { module = "io.github.pdvrieze.xmlutil:core-io", version.ref = "xmlutil" }

# YAML
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

# JSON
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-jsonIo = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "kotlinxSerialization" }

# Date / time
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Country-specific logic
countryboundaries = { module = "de.westnordost:countryboundaries", version.ref = "countryboundaries" }

# OSM features
osmfeatures = { module = "de.westnordost:osmfeatures", version.ref = "osmfeatures" }

# Opening hours parser
osm-openingHours = { module = "de.westnordost:osm-opening-hours", version.ref = "osmOpeningHours" }

# UI (Compose)
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-uiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

# UI navigation
androidx-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodelNavigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# UI ViewModel
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Map
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre" }

# Map runtimes (selected by platform in the app modules)
maplibre-runtime-android = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibre" }
maplibre-runtime-macosArm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-metal-macos-arm64", version.ref = "maplibre" }
maplibre-runtime-macosX64 = { module = "org.maplibre.compose:maplibre-compose-runtime-metal-macos-x64", version.ref = "maplibre" }
maplibre-runtime-windowsArm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-windows-arm64", version.ref = "maplibre" }
maplibre-runtime-windowsX64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-windows-x64", version.ref = "maplibre" }
maplibre-runtime-linuxArm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-linux-arm64", version.ref = "maplibre" }
maplibre-runtime-linuxX64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-linux-x64", version.ref = "maplibre" }

# Non-lazy grid
compose-grid = { module = "com.cheonjaeung.compose.grid:grid", version.ref = "composeGrid" }

# Reorderable lists
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

# Sharing presets/settings via QR code
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

# Encoding URL configuration for QR codes
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }

# Taking photos, picking images, and file access
filekit-dialogsCompose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }

# Webview for OAuth login
compose-webview = { module = "io.github.kevinnzou:compose-webview-multiplatform", version.ref = "composeWebview" }

# Scheduling background jobs (Android)
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Core library desugaring (Android)
desugar-jdkLibs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Build logic (buildSrc; countryboundaries is shared with the app)
klaxon = { module = "com.beust:klaxon", version.ref = "klaxon" }
buildsrc-kotlinxIo = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "buildsrcKotlinxIo" }
yamlbeans = { module = "com.esotericsoftware.yamlbeans:yamlbeans", version.ref = "yamlbeans" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
buildsrc-kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "buildsrcKotlinxSerialization" }
buildsrc-kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "buildsrcKaml" }
markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
